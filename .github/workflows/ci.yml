name: ci
on:
  push:
    branches: [main]
  pull_request:

# No API keys in CI: the copilot graphs run on the deterministic fake chat model (real calls only in `make eval-live`).
env:
  GB_LLM: fake
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Prompts changed only with passing evals
        run: uv run python -c "from gbcopilot.prompting import unlocked; import sys; u = unlocked(); print(u); sys.exit(1 if u else 0)"
      - name: Tests (lite mode; data- and full-mode tests auto-skip without their inputs)
        run: uv run pytest
      - name: Fast evals (simulator + copilot + RAG + red team)
        run: uv run python -m gbevals.run --fast

  promptfoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copilot red-team suite (promptfoo, Python provider over the LangGraph copilot)
        working-directory: evals/promptfoo
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: |
          npm ci || npm install
          uv run python build_config.py
          npx promptfoo eval -c promptfooconfig.yaml --no-cache --no-progress-bar -j 1 --no-table

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
