[project]
name = "ghostbus"
version = "0.1.0"
description = "Real-time bus reliability platform: ghost-bus detection, calibrated arrival ranges, reliability scores from MBTA open data."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.0",
  "gtfs-realtime-bindings>=1.0",
  "protobuf>=4.25",
  "httpx>=0.27",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "sqlglot>=25",
  "pyyaml>=6",
  "numpy>=1.26",
  "redis>=5",
  "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/core/gbcore",
  "packages/agency/gbagency",
  "packages/schemas/gbschemas",
  "services/stream/gbstream",
  "services/api/gbapi",
  "data/pipeline/gbdata",
  "sim/gbsim",
  "ml/gbml",
  "copilot/gbcopilot",
  "evals/gbevals",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "full: requires Docker full-mode services (Postgres/Redis); skipped when unavailable",
  "slow: slower integration tests",
  "network: touches the network (skipped by default)",
]
addopts = "-q -m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "E731", "B007"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
